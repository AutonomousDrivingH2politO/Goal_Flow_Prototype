[project]
name = "gfsem"
version = "0.0.1"
description = "GoalFlow-style planner prototype for AD-SEM (H2politO)"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python>=4.8",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
