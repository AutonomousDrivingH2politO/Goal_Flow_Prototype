# Vehicle and camera constants. Camera values provided by Can on 2026-11-18.
# Vehicle values corrected 2026-11-24 to the final Juno data sheet
# (configs/juno_relevant_info.xlsx, from Juno's designers and the strategy team).
vehicle:
  name: Juno
  wheelbase_m: 1.60
  length_m: 2.875
  width_m: 1.165
  track_m: 1.00
  tyre_radius_m: 0.279
  height_m: 1.165
  turning_radius_m: 5.5        # mechanical, data sheet
  max_steer_deg: 10.0          # hard limit in the AD-SEM stack -> R_min = 1.60 / tan(10 deg) = 9.07 m
  # Overhangs are not in the data sheet. Assumption until measured: symmetric,
  # (length - wheelbase) / 2 = 0.6375 m front and rear of the axles. TODO(Can)
  rear_overhang_m: null
camera:
  model: ZED 2i
  serial: 39159302           # from the SVO2 headers
  height_m: 1.25             # above ground
  pitch_deg: 0.0             # optical axis parallel to the ground
  # Factory-rectified left intrinsics read from the SVO2 files:
  hd720: {width: 1280, height: 720, fx: 533.7, fy: 533.7, cx: 638.4, cy: 362.1}
  hd2k:  {width: 2208, height: 1242, fx: 1074.6, cx: 1105.5, cy: 627.0}
  baseline_m: 0.120
obstacles:
  bollard: {radius_m: 0.225, height_m: 1.10, colour: blue}
  cone:    {radius_m: 0.25, height_m: 0.40, colour: orange}
segmentation:
  # TwinLiteNetPlus (drivable area + lane), team model. Used read-only, offline, for pseudo-labels.
  repo: /home/bylogix/AD-SEM/src/shared_objects/src/shared_objects/TwinLiteNetPlus
  checkpoint: pretrained/twinliteplus_pretrained/large.pth
units:
  ecu_speed: km/h           # /ECU/speed verified: bag "saw_15kmh_max" peaks at 15.08
scale_source: ecu           # Can 2026-11-18: ECU speed is accurate, ZED odometry is not (use ZED only for rotation, if at all)
target_obstacles: [bollard, cone]   # Can 2026-11-18: people are NOT the intended obstacle class
